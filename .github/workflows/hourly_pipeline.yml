name: Hourly Self-Healing Event Pipeline

on:
  schedule:
    # Runs automatically at minute 0 of every hour
    - cron: '0 * * * *'
  # Allows manual execution via GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Headless Browsers
        run: |
          playwright install --with-deps chromium

      - name: Execute Self-Healing Pipeline
        run: |
          python run_pipeline.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage regenerated datasets, logs, and updated source configs
          git add normalized_events.json sources.yaml South_Bend_Master_Event_Sources*.xlsx scraper_output.log investigation_report.json .scrape_cache.json
          
          # Commit only if changes exist
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update event data and self-healing configs [skip ci]" && git push)